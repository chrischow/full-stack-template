services:
  db:
    image: postgres:16.14
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=app
    ports:
      - "5432:5432"
    volumes:
      - app-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-q", "-d", "postgres", "-U", "postgres" ]
      interval: 5s
      timeout: 2s
      retries: 10
  dex:
    image: dexidp/dex:v2.45.1-alpine
    container_name: dex
    ports:
      - "5556:5556"
    volumes:
      - ./services/mock-auth/config.yaml:/etc/dex/config.yaml
    command: ["dex", "serve", "/etc/dex/config.yaml"]


volumes:
  app-pg-data: