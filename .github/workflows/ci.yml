name: CI
on:
  push:
    branches: [develop]
    paths-ignore:
      - '.pi/**'
      - 'docs/**'
      - '**/*.md'
jobs:
  changed-files:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.app-changes.outputs.any_modified }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Fail closed on an initial branch push with no valid before SHA.
      - name: Detect app-affecting changes in this push
        if: github.event.before != '0000000000000000000000000000000000000000'
        id: app-changes
        uses: tj-actions/changed-files@ed68ef82c095e0d48ec87eccea555d944a631a4c # v46
        with:
          base_sha: ${{ github.event.before }}
          sha: ${{ github.sha }}
          files: |
            apps/**
            packages/**
            infra/**
            Dockerfile.lambda
            .dockerignore
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
            turbo.json
            .github/workflows/ci.yml
          files_ignore: |
            **/*.[mM][dD]
            **/*.[mM][dD][xX]
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache/restore@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.job }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-
      - run: pnpm lint
      - uses: actions/cache/save@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.job }}
  check-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache/restore@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.job }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-
      - run: pnpm check-types
      - uses: actions/cache/save@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.job }}
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
  build:
    needs: [lint, check-types, format]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache/restore@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.job }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-
      - run: pnpm build
      - uses: actions/cache/save@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.job }}
  deploy:
    needs: [build, changed-files]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && needs.build.result == 'success' && needs.changed-files.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: prototype-serverless-deploy
      cancel-in-progress: false
    env:
      IMAGE_TAG: ${{ github.sha }}
      PULUMI_BACKEND_URL: ${{ vars.PROTOTYPE_PULUMI_BACKEND_URL }}
      AWS_REGION: ap-southeast-1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: pulumi/setup-pulumi@v2
        with:
          pulumi-version: 3.267.0
      - name: Configure dedicated deployer credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.PROTOTYPE_CD_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.PROTOTYPE_CD_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Skip if newer app changes have reached develop
        id: current
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = await github.rest.repos.getBranch({ owner, repo, branch: 'develop' });
            if (branch.data.commit.sha === context.sha) {
              core.setOutput('current', 'true');
              return;
            }
            const comparison = await github.rest.repos.compareCommits({
              owner, repo, base: context.sha, head: branch.data.commit.sha,
              per_page: 300,
            });
            // Fail closed on force-pushes or truncated comparisons.
            if (comparison.data.status !== 'ahead' ||
                comparison.data.total_commits > 250 ||
                !comparison.data.files || comparison.data.files.length >= 300) {
              core.setOutput('current', 'false');
              return;
            }
            const rootFiles = new Set([
              'Dockerfile.lambda', '.dockerignore', 'package.json',
              'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'turbo.json',
              '.github/workflows/ci.yml',
            ]);
            const affectsApp = (file) =>
              !/\.mdx?$/i.test(file) &&
              (/^(apps|packages|infra)\//.test(file) || rootFiles.has(file));
            core.setOutput('current', String(!comparison.data.files.some((file) =>
              affectsApp(file.filename) || (file.previous_filename && affectsApp(file.previous_filename))
            )));
      - name: Update the existing prototype stack
        if: steps.current.outputs.current == 'true'
        working-directory: infra/prototype-serverless
        run: |
          test -n "$IMAGE_TAG" && test -n "$PULUMI_BACKEND_URL"
          pulumi login "$PULUMI_BACKEND_URL"
          pulumi stack select prototype
          pulumi up --yes