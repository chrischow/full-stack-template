name: CI
on:
  push:
    branches: [develop]
    paths-ignore:
      - '.pi/**'
      - 'docs/**'
      - '**/*.md'
env:
  is_prototype_infra_initialised: false
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache/restore@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.job }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-
      - run: pnpm lint
      - uses: actions/cache/save@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.job }}
  check-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache/restore@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.job }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-
      - run: pnpm check-types
      - uses: actions/cache/save@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.job }}
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
  build:
    needs: [lint, check-types, format]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache/restore@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.job }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-
      - run: pnpm build
      - uses: actions/cache/save@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.job }}
  should-deploy:
    runs-on: ubuntu-latest
    if: is_prototype_infra_initialised == 'true'
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.app-changes.outputs.any_modified }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Fail closed on an initial branch push with no valid before SHA.
      - name: Detect app-affecting changes in this push
        if: github.event.before != '0000000000000000000000000000000000000000'
        id: app-changes
        uses: tj-actions/changed-files@v47
        with:
          base_sha: ${{ github.event.before }}
          sha: ${{ github.sha }}
          files: |
            apps/**
            packages/**
            infra/**
            Dockerfile.lambda
            .dockerignore
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
            turbo.json
            .github/workflows/ci.yml
          files_ignore: |
            **/*.[mM][dD]
            **/*.[mM][dD][xX]
  deploy:
    needs: [build, should-deploy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && needs.should-deploy.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: prototype-serverless-deploy
      cancel-in-progress: false
    env:
      IMAGE_TAG: ${{ github.sha }}
      PULUMI_BACKEND_URL: ${{ vars.PROTOTYPE_PULUMI_BACKEND_URL }}
      AWS_REGION: ap-southeast-1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: pulumi/setup-pulumi@v2
        with:
          pulumi-version: 3.267.0
      - name: Configure dedicated deployer credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.PROTOTYPE_CD_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.PROTOTYPE_CD_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to Amazon Public ECR
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public
      - name: Update the existing prototype stack
        working-directory: infra/prototype-serverless
        run: |
          test -n "$IMAGE_TAG" && test -n "$PULUMI_BACKEND_URL"
          pulumi login "$PULUMI_BACKEND_URL"
          pulumi stack select prototype
          pulumi up --yes